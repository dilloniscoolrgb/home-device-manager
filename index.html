<!doctype html>
<html lang="en"><head><meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home Device Manager</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.12.1/dist/JsBarcode.all.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&amp;family=Space+Mono:wght@400;700&amp;display=swap" rel="stylesheet">
  <style>
    :root{color-scheme:dark;--bg:#0b0e13;--panel:#141921;--panel2:#1a212c;--border:#293240;--text:#f3f6fa;--muted:#9baabc;--blue:#519bff}
    *{box-sizing:border-box}body{font-family:"DM Sans",sans-serif;color:var(--text);margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}
    :focus-visible{outline:2px solid #8bbcff;outline-offset:3px}.shell{display:flex;width:100%;min-height:calc(100 * min(var(--vh, 1vh), 1vh))}
    .sidebar{position:sticky;top:0;width:244px;height:calc(100 * min(var(--vh, 1vh), 1vh));flex:none;border-right:1px solid var(--border);background:#10141b;padding:27px 15px;display:flex;flex-direction:column;gap:28px;overflow-y:auto}
    .brand{display:flex;align-items:center;gap:12px;padding:2px 12px;font-weight:700;letter-spacing:-.03em;font-size:17px}.brand-mark{width:34px;height:34px;border-radius:10px;background:#287df5;display:grid;place-items:center;color:#fff;font-size:19px}
    .nav-btn{width:100%;border:0;background:transparent;color:#a9b6c6;text-align:left;padding:11px 13px;border-radius:10px;display:flex;gap:13px;align-items:center;font-size:14px;font-weight:600;transition:.2s}.nav-btn:hover,.nav-btn.active{color:#fff;background:#222d3c}.nav-btn.active{box-shadow:inset 3px 0 #519bff}.nav-icon{width:20px;text-align:center;font-size:17px}
    .workspace{min-width:0;flex:1}.topbar{min-height:76px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px clamp(20px,3vw,45px);background:#0f131a}
    .search-wrap{position:relative;width:min(440px,100%)}.search-wrap input{width:100%;background:#1a202a;border:1px solid #303a48;border-radius:11px;padding:11px 14px 11px 39px;color:#fff;outline:none}.search-wrap input:focus{border-color:var(--blue)}.search-wrap input::placeholder{color:#8795a7}.search-glyph{position:absolute;left:14px;top:11px;color:#9eaabc}.search-results{position:absolute;z-index:40;left:0;right:0;top:calc(100% + 7px);background:#1b222c;border:1px solid #3b4858;border-radius:12px;box-shadow:0 20px 50px #0009;max-height:300px;overflow:auto}.search-result{display:block;width:100%;background:none;border:0;text-align:left;padding:11px 14px;color:#fff;border-bottom:1px solid var(--border)}.search-result:hover{background:#283648}.search-result small{display:block;color:var(--muted);margin-top:3px}
    .main-content{max-width:1510px;margin:auto;padding:34px clamp(20px,3vw,45px) 70px}.eyebrow{color:#77adff;font-size:11px;text-transform:uppercase;letter-spacing:.17em;font-weight:700;margin-bottom:7px}.page-head{display:flex;justify-content:space-between;align-items:end;gap:16px;margin-bottom:27px}.page-head h1{font-weight:700;letter-spacing:-.045em;line-height:1.13;margin:0}.subtle{color:var(--muted)}.section-title{font-size:18px;font-weight:700;letter-spacing:-.025em}
    .panel{background:var(--panel);border:1px solid var(--border);border-radius:16px}.stat-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:13px;margin:24px 0 34px}.stat{padding:19px;min-height:116px}.stat .number{font-size:30px;font-weight:700;letter-spacing:-.05em;margin-top:11px}.stat-label{font-size:12px;color:#b5c1cf;font-weight:600}.stat.loss .number{color:#f8ce67}.stat.stolen .number{color:#ff8585}.stat.mdm .number{color:#77afff}
    .btn{border:1px solid #384453;background:#222b38;color:#edf4ff;padding:9px 13px;border-radius:9px;font-size:13px;font-weight:700;transition:background .2s,transform .2s;white-space:nowrap}.btn:hover{background:#304055;transform:translateY(-1px)}.btn.primary{background:#287df5;border-color:#287df5;color:white}.btn.primary:hover{background:#438fff}.btn.danger{color:#ffaaaa;border-color:#693c43}.btn.warning{color:#f8ce67}.btn.small{padding:6px 9px;font-size:12px}.btn.quiet{background:transparent}.button-row{display:flex;flex-wrap:wrap;gap:8px}
    .device-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.device-card{padding:18px;transition:transform .2s,border-color .2s}.device-card:hover{transform:translateY(-2px);border-color:#496079}.device-card h3{font-size:16px;font-weight:700;margin:0}.device-icon{width:39px;height:39px;border:1px solid #385078;background:#192d49;color:#8cbcff;border-radius:11px;display:grid;place-items:center;font-size:19px}.badge{display:inline-block;padding:4px 9px;border-radius:7px;font-size:11px;font-weight:700;white-space:nowrap}.status-Active{background:#163c34;color:#83e8bc}.status-Available{background:#21364e;color:#9fcbff}.status-Lost{background:#49391b;color:#ffda7d}.status-Stolen{background:#4b262d;color:#ffa0a6}.status-Repair{background:#3c344e;color:#d8b9ff}.status-Retired{background:#30353c;color:#bbc2cb}
    .device-table{width:100%;border-collapse:collapse;text-align:left}.device-table th{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#9aabbd;padding:14px 17px;background:#1b222b}.device-table td{padding:15px 17px;border-top:1px solid var(--border);font-size:13px;vertical-align:middle}.device-table tr:hover td{background:#1b232e}.mono{font-family:"Space Mono",monospace;font-size:11px;word-break:break-all}.muted{color:var(--muted)}.table-scroller{overflow-x:auto;border-radius:16px}.filters{display:flex;gap:11px;flex-wrap:wrap;margin:0 0 17px}.filters select,.field input,.field select,.field textarea{background:#1d2530;border:1px solid #374352;border-radius:9px;padding:10px 11px;color:white;min-height:42px}.filters select{min-width:148px}.field input,.field select,.field textarea{width:100%}.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid #519bff;outline-offset:1px}.field label{display:block;color:#cbd5e1;font-size:12px;font-weight:700;margin:0 0 7px}.field .error{font-size:11px;color:#ffa0a6;margin-top:5px;min-height:1em}.form-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.form-section{padding:22px;margin-bottom:16px}.form-section h2{font-size:16px;font-weight:700;margin:0 0 18px}.span-all{grid-column:1/-1}
    .detail-grid{display:grid;grid-template-columns:1.3fr .7fr;gap:17px}.detail-info,.codes-panel{padding:23px}.detail-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.detail-fields dt{color:#93a3b7;font-size:11px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}.detail-fields dd{margin:0;font-size:14px;overflow-wrap:anywhere}.code-box{background:#fff;border-radius:10px;padding:14px;color:#111;display:flex;align-items:center;justify-content:center;min-height:145px;margin:13px 0 8px;overflow:hidden}.code-box svg{max-width:100%}.code-box canvas,.code-box img{max-width:100%}.mdm-box{padding:21px;margin-top:17px}.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:15px;padding:13px 0;border-top:1px solid var(--border)}.toggle-row:first-child{border-top:0}.toggle-row label{font-size:13px;font-weight:600}.toggle-row input{appearance:none;width:40px;height:23px;border-radius:20px;background:#445162;position:relative;cursor:pointer;flex:none;transition:.2s}.toggle-row input:before{content:"";position:absolute;width:17px;height:17px;top:3px;left:3px;background:white;border-radius:50%;transition:.2s}.toggle-row input:checked{background:#287df5}.toggle-row input:checked:before{transform:translateX(17px)}
    .empty{padding:45px 20px;text-align:center;color:#aab9c9}.empty strong{display:block;color:#f1f5fa;margin-bottom:5px}.overlay{position:fixed;inset:0;background:#05070acc;z-index:90;display:grid;place-items:center;padding:16px}.dialog{width:min(460px,100%);padding:23px;background:#1b232e;border:1px solid #455366;border-radius:17px;box-shadow:0 30px 100px #0009}.dialog h2{font-size:20px;margin:0 0 8px}.dialog p{color:#bac7d6;font-size:13px;line-height:1.6}.dialog .button-row{justify-content:flex-end;margin-top:21px}.toast{position:fixed;bottom:23px;right:23px;z-index:120;background:#263b50;border:1px solid #4d7db2;color:white;padding:12px 17px;border-radius:10px;box-shadow:0 12px 35px #0008;max-width:min(360px,90vw);font-size:13px}.print-label{background:#fff;color:#101820;padding:20px;border:2px solid #17212c;border-radius:7px;width:100%;max-width:360px;margin:15px auto}.print-label .code-box{padding:3px;margin:3px 0;min-height:auto}.print-label .code-box>div{display:flex;justify-content:center}.print-label .code-box img{width:104px;height:104px}.print-label svg{max-height:70px}.print-label .badge{border:1px solid #999;color:#111;background:#fff}.menu-toggle{display:none}.drawer-backdrop{display:none}
    @media(max-width:1100px){.stat-grid{grid-template-columns:repeat(3,1fr)}.device-grid{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:760px){.sidebar{position:fixed;inset:0 auto 0 0;z-index:80;transform:translateX(-100%);transition:transform .25s;box-shadow:20px 0 60px #0008}.sidebar.open{transform:translateX(0)}.drawer-backdrop.open{display:block;position:fixed;inset:0;background:#0009;z-index:79}.menu-toggle{display:block}.topbar{padding:13px 19px}.main-content{padding:25px 18px 55px}.detail-grid{grid-template-columns:1fr}.device-grid{grid-template-columns:1fr 1fr}.page-head{align-items:start}}@media(max-width:520px){.stat-grid{grid-template-columns:repeat(2,1fr)}.device-grid,.form-grid,.detail-fields{grid-template-columns:1fr}.topbar .top-caption{display:none}.page-head{flex-direction:column}.search-wrap{flex:1;min-width:0}.button-row{gap:6px}}
    @media print{body,body[data-template-id]{background:white!important;color:black!important}.shell,.overlay,.toast{display:none!important}#print-overlay{display:block!important;position:static!important;background:white!important;padding:0!important}#print-overlay .dialog{border:0;box-shadow:none;width:100%;max-width:none;padding:0;background:white!important}#print-overlay .dialog>h2,#print-overlay .dialog>p,#print-overlay .button-row{display:none!important}.print-label{margin:0;width:85mm;max-width:85mm;border:1px solid black;break-inside:avoid}@page{margin:12mm}}
  </style>
  <script src="https://cdn.tailwindcss.com/3.4.17" type="text/javascript"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.577.0/dist/umd/lucide.min.js" type="text/javascript"></script>
  </head>
 <body data-template-id="__page-root" class="w-full" style="background: rgb(11, 14, 19);">
  <div class="shell">
   <aside id="sidebar" data-template-id="sidebar" class="sidebar canva-sidebar" aria-label="Primary navigation" style="background: rgb(16, 20, 27);">
    <div class="brand">
     <span class="brand-mark" aria-hidden="true">⌘</span><span data-template-id="brand-name" class="canva-text" style="color: rgb(243, 246, 250);"><span data-template-id="brand-name-text" class="canva-text" style="color: rgb(243, 246, 250); font-weight: 700; font-style: normal; font-size: 17px;">Home Device Manager</span></span>
    </div>
    <nav id="nav" aria-label="Main menu"></nav>
    <div class="mt-auto px-3 subtle" style="font-size:11px;line-height:1.5">
     PERSONAL INVENTORY<br>
      Prototype MDM workspace
    </div>
   </aside>
   <div id="drawer-backdrop" class="drawer-backdrop"></div>
   <div class="workspace">
    <header data-template-id="topbar" class="topbar canva-header" style="background: rgb(15, 19, 26);"><button id="menu-toggle" type="button" class="btn menu-toggle" aria-label="Open navigation" aria-expanded="false">☰</button>
     <div class="search-wrap">
      <span class="search-glyph" aria-hidden="true">⌕</span><label class="sr-only" for="global-search">Search devices</label><input id="global-search" type="search" placeholder="Search devices, serials, assets..." autocomplete="off">
      <div id="search-results" class="search-results hidden" role="listbox" aria-label="Device search results"></div>
     </div><span class="top-caption subtle" style="font-size:12px">HOME / DEVICE OPERATIONS</span>
    </header>
    <main id="main" class="main-content"></main>
   </div>
  </div>
  <div id="confirm-overlay" class="overlay hidden" role="presentation">
   <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <h2 id="confirm-title"></h2>
    <p id="confirm-message"></p>
    <div class="button-row">
     <button id="confirm-cancel" class="btn" type="button">Cancel</button><button id="confirm-accept" class="btn danger" type="button">Confirm</button>
    </div>
   </div>
  </div>
  <div id="print-overlay" class="overlay hidden" aria-hidden="true" role="presentation">
   <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="print-title" style="width:min(530px,100%);max-height:90vh;overflow:auto">
    <h2 id="print-title">Print device label</h2>
    <p>Compact identification label preview.</p>
    <div id="label-preview"></div>
    <div class="button-row">
     <button id="print-close" type="button" class="btn">Close</button><button id="print-action" type="button" class="btn primary">Print label</button>
    </div>
   </div>
  </div>
  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
  <script>
(() => {
  const STORE='hdm.devices.v1', PREFS='hdm.settings.v1';
  const statuses=['Active','Available','Lost','Stolen','Repair','Retired'];
  const mdmKeys=[['enrolled','MDM Enrolled'],['supervised','Supervised'],['remoteLock','Remote Lock'],['lostMode','Lost Mode'],['remoteErase','Remote Erase'],['reenroll','Re-enrollment after erase']];
  const seed=[
    {name:'MacBook Air · Living Room',type:'Laptop',manufacturer:'Apple',model:'MacBook Air M3',serial:'C02XL7H1Q6L7',imei:'',assetId:'HOME-1001',os:'macOS',osVersion:'15.1',user:'Alex Morgan',location:'Living room',purchaseDate:'2024-04-18',notes:'Family laptop.',status:'Active',mdm:{enabled:true,enrolled:true,supervised:false,remoteLock:false,lostMode:false,remoteErase:false,reenroll:true}},
    {name:'Alex’s iPhone',type:'Phone',manufacturer:'Apple',model:'iPhone 15 Pro',serial:'F2LW91RT2X',imei:'359710341234567',assetId:'HOME-1002',os:'iOS',osVersion:'18.2',user:'Alex Morgan',location:'With owner',purchaseDate:'2023-10-12',notes:'Primary phone.',status:'Active',mdm:{enabled:true,enrolled:true,supervised:true,remoteLock:false,lostMode:false,remoteErase:false,reenroll:true}},
    {name:'Studio iPad',type:'Tablet',manufacturer:'Apple',model:'iPad Air 11-inch',serial:'DMPV58HK6FC',imei:'',assetId:'HOME-1003',os:'iPadOS',osVersion:'18.1',user:'Jamie Morgan',location:'Studio',purchaseDate:'2024-07-22',notes:'Drawing and planning.',status:'Available',mdm:{enabled:false}},
    {name:'Garage Workstation',type:'Desktop',manufacturer:'Dell',model:'OptiPlex 7010',serial:'7K2X4Q3',imei:'',assetId:'HOME-1004',os:'Windows',osVersion:'11 Pro',user:'Jamie Morgan',location:'Garage',purchaseDate:'2022-08-06',notes:'Needs new cooling fan.',status:'Repair',mdm:{enabled:false}},
    {name:'Travel Phone',type:'Phone',manufacturer:'Samsung',model:'Galaxy S23',serial:'R5CT103JFWN',imei:'353210121234567',assetId:'HOME-1005',os:'Android',osVersion:'14',user:'Sam Morgan',location:'Last seen: airport',purchaseDate:'2023-06-13',notes:'Reported missing while travelling.',status:'Lost',mdm:{enabled:false}},
    {name:'Old Family Tablet',type:'Tablet',manufacturer:'Apple',model:'iPad mini',serial:'F9FT2L0KH2',imei:'',assetId:'HOME-1006',os:'iPadOS',osVersion:'17.6',user:'Household',location:'Storage closet',purchaseDate:'2020-11-04',notes:'Kept as a spare.',status:'Retired',mdm:{enabled:false}}
  ];
  const defaults={title:'Home Device Manager',confirmDestructive:true};
  const read=(key,fallback)=>{try{const v=localStorage.getItem(key);return v===null?fallback:JSON.parse(v)}catch{return fallback}};
  let devices=read(STORE,null);if(!Array.isArray(devices)){devices=seed.map((d,i)=>({...d,id:'example-'+(i+1),createdAt:new Date(Date.now()-i*86400000).toISOString()}));saveDevices()}
  let settings={...defaults,...read(PREFS,{})};
  let view='Dashboard',selected=null,editId=null,filters={status:'All statuses',type:'All types',mdm:'All enrollment'},toastTimer,confirmCallback=null;
  const $=s=>document.querySelector(s), main=$('#main'), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function saveDevices(){try{localStorage.setItem(STORE,JSON.stringify(devices));return true}catch{toast('Could not save inventory in this browser.');return false}}
  function saveSettings(){try{localStorage.setItem(PREFS,JSON.stringify(settings))}catch{toast('Could not save settings.')}}
  function toast(text){const el=$('#toast');el.textContent=text;el.classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.add('hidden'),3300)}
  function uid(){return crypto.randomUUID?crypto.randomUUID():'dev-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)}
  function asset(){let id;do{id='HOME-'+Math.floor(1000+Math.random()*90000)}while(devices.some(d=>d.assetId.toLowerCase()===id.toLowerCase()));return id}
  function normalize(d){return {...d,mdm:{enabled:false,enrolled:false,supervised:false,remoteLock:false,lostMode:false,remoteErase:false,reenroll:false,...d.mdm}}}
  devices=devices.map(normalize);
  function codeUrl(d){return 'https://home-device-manager.local/device/'+encodeURIComponent(d.id)}
  function badge(s){return `<span class="badge status-${esc(s)}">${esc(s)}</span>`}
  function btn(action,label,id='',extra=''){return `<button class="btn small ${extra}" type="button" data-action="${action}" ${id?`data-id="${esc(id)}"`:''}>${label}</button>`}
  function heading(title,sub,action=''){return `<div class="page-head"><div><div class="eyebrow">HOME / INVENTORY</div><h1>${esc(title)}</h1><p class="subtle mt-2 mb-0" style="font-size:13px">${esc(sub)}</p></div>${action}</div>`}
  function empty(title,sub){return `<div class="panel empty"><strong>${esc(title)}</strong>${esc(sub)}</div>`}
  function find(id){return devices.find(d=>d.id===id)}
  function navigate(v){view=v;editId=null;selected=null;closeDrawer();render();window.scrollTo({top:0,behavior:'smooth'})}
  function openDevice(id){if(!find(id))return;selected=id;view='Detail';closeDrawer();$('#global-search').value='';$('#search-results').classList.add('hidden');render();window.scrollTo({top:0,behavior:'smooth'})}
  function navRender(){const pages=[['Dashboard','▦'],['Your Devices','▤','Devices'],['Add Device','＋'],['Lost & Stolen','⚑'],['MDM','◇'],['Labels','▣'],['Settings','⚙']];$('#nav').innerHTML=pages.map(([name,icon,target=name])=>`<button type="button" class="nav-btn ${view===target||(view==='Detail'&&target==='Devices')?'active':''}" data-nav="${target}" ${view===target?'aria-current="page"':''}><span class="nav-icon" aria-hidden="true">${icon}</span>${name}</button>`).join('')}
  function render(){navRender();$('#brand-name-text').textContent=settings.title;document.title=settings.title;const routes={'Dashboard':dashboard,'Devices':inventory,'Add Device':form,'Detail':detail,'Lost & Stolen':lost,'MDM':mdmPage,'Labels':labels,'Settings':settingsPage};main.innerHTML=(routes[view]||dashboard)();if(view==='Detail')renderCodes();if(view==='Add Device')attachForm()}
  function deviceCard(d){return `<article class="panel device-card"><div class="flex items-start justify-between gap-3"><div class="device-icon" aria-hidden="true">${d.type==='Phone'?'▯':d.type==='Laptop'?'▱':d.type==='Tablet'?'▣':'▥'}</div>${badge(d.status)}</div><h3 class="mt-4">${esc(d.name)}</h3><p class="muted mt-1 mb-3" style="font-size:12px">${esc(d.type)} · ${esc(d.model)}</p><p class="muted mb-4" style="font-size:12px">${esc(d.location||d.user||'Unassigned')}</p><div class="button-row">${btn('open','Details',d.id)}${btn('edit','Edit',d.id)}${btn('label','Print label',d.id)}</div></article>`}
  function dashboard(){const stats=[['Total Devices',devices.length,''],['Active',devices.filter(d=>d.status==='Active').length,''],['Lost',devices.filter(d=>d.status==='Lost').length,'loss'],['Stolen',devices.filter(d=>d.status==='Stolen').length,'stolen'],['MDM Enrolled',devices.filter(d=>d.mdm.enabled&&d.mdm.enrolled).length,'mdm']];return heading('Dashboard','Your household technology, accounted for.',btn('add','＋ Add device','','primary'))+`<section aria-label="Inventory statistics" class="stat-grid">${stats.map(([label,n,cls])=>`<div class="panel stat ${cls}"><div class="stat-label">${label}</div><div class="number">${n}</div></div>`).join('')}</section><section><div class="flex justify-between items-center mb-4"><h2 class="section-title">Recent devices</h2>${btn('all','View all devices')}</div>${devices.length?`<div class="device-grid">${[...devices].sort((a,b)=>b.createdAt.localeCompare(a.createdAt)).slice(0,6).map(deviceCard).join('')}</div>`:empty('No devices yet','Add your first device to start your inventory.')}</section>`}
  function inventory(){const types=[...new Set(devices.map(d=>d.type))].sort();const options=(values,current)=>values.map(x=>`<option ${x===current?'selected':''}>${esc(x)}</option>`).join('');const q=($('#global-search').value||'').trim().toLowerCase();const visible=devices.filter(d=>(filters.status==='All statuses'||d.status===filters.status)&&(filters.type==='All types'||d.type===filters.type)&&(filters.mdm==='All enrollment'||(filters.mdm==='Enrolled'?d.mdm.enabled&&d.mdm.enrolled:!(d.mdm.enabled&&d.mdm.enrolled)))&&(!q||matches(d,q)));return heading('Devices',`${devices.length} devices in your inventory.`,btn('add','＋ Add device','','primary'))+`<div class="filters"><label class="sr-only" for="status-filter">Filter by status</label><select id="status-filter">${options(['All statuses',...statuses],filters.status)}</select><label class="sr-only" for="type-filter">Filter by device type</label><select id="type-filter">${options(['All types',...types],filters.type)}</select><label class="sr-only" for="mdm-filter">Filter by MDM enrollment</label><select id="mdm-filter">${options(['All enrollment','Enrolled','Not enrolled'],filters.mdm)}</select></div>${visible.length?`<div class="panel table-scroller"><table class="device-table"><thead><tr><th>Device</th><th>Asset ID</th><th>Status</th><th>Assigned / Location</th><th>MDM</th><th>Actions</th></tr></thead><tbody>${visible.map(d=>`<tr><td><strong>${esc(d.name)}</strong><br><span class="muted">${esc(d.type)} · ${esc(d.model)}</span></td><td class="mono">${esc(d.assetId)}</td><td>${badge(d.status)}</td><td>${esc(d.user||'—')}<br><span class="muted">${esc(d.location||'—')}</span></td><td>${d.mdm.enabled&&d.mdm.enrolled?'Enrolled':'—'}</td><td><div class="button-row">${btn('open','Details',d.id)}${btn('edit','Edit',d.id)}${btn('status-menu','Status',d.id)}${btn('delete','Delete',d.id,'danger')}</div></td></tr>`).join('')}</tbody></table></div>`:empty('No matching devices','Try different filters or search terms.')}`}
  function matches(d,q){return ['name','serial','imei','assetId','model','user'].some(k=>String(d[k]||'').toLowerCase().includes(q))}
  const formFields=[['name','Device name',true],['type','Device type',true],['manufacturer','Manufacturer',true],['model','Model',true],['serial','Serial number',true],['imei','IMEI',false],['assetId','Asset ID',false],['os','Operating system',true],['osVersion','OS version',false],['user','Assigned user',false],['location','Location',false],['purchaseDate','Purchase date',false]];
  function fieldHTML([key,label,required],d){const val=esc(d[key]||'');let input;if(key==='type')input=`<select id="f-${key}" name="${key}" ${required?'required':''}><option value="">Select type</option>${['Phone','Laptop','Tablet','Desktop','Smartwatch','Other'].map(x=>`<option ${d[key]===x?'selected':''}>${x}</option>`).join('')}</select>`;else if(key==='os')input=`<input id="f-${key}" name="${key}" value="${val}" list="os-options" ${required?'required':''}>`;else input=`<input id="f-${key}" name="${key}" type="${key==='purchaseDate'?'date':'text'}" value="${val}" ${required?'required':''} ${key==='assetId'?'placeholder="Generated if left blank"':''}>`;return `<div class="field"><label for="f-${key}">${label}${required?' *':''}</label>${input}<div class="error" id="error-${key}" aria-live="polite"></div></div>`}
  function form(){const d=find(editId)||{};return heading(editId?'Edit device':'Add device',editId?'Update device information and MDM enrollment.':'Register a device in your home inventory.')+`<form id="device-form" novalidate><section class="panel form-section"><h2>Device identity</h2><div class="form-grid">${formFields.slice(0,7).map(f=>fieldHTML(f,d)).join('')}</div></section><section class="panel form-section"><h2>Software & assignment</h2><div class="form-grid">${formFields.slice(7).map(f=>fieldHTML(f,d)).join('')}<div class="field"><label for="f-status">Status</label><select id="f-status" name="status">${statuses.map(x=>`<option ${d.status===x?'selected':''}>${x}</option>`).join('')}</select><div class="error" id="error-status"></div></div><div class="field span-all"><label for="f-notes">Notes</label><textarea id="f-notes" name="notes" rows="3">${esc(d.notes||'')}</textarea></div></div></section><section class="panel form-section"><h2>Home MDM</h2><p class="subtle" style="font-size:12px">Prototype controls only — real Apple MDM commands will be connected later.</p><div class="toggle-row"><label for="f-mdm-enabled">Enable Home MDM</label><input type="checkbox" role="switch" id="f-mdm-enabled" ${d.mdm?.enabled?'checked':''}></div><div id="form-mdm-options" ${d.mdm?.enabled?'':'hidden'}>${mdmKeys.map(([key,label])=>`<div class="toggle-row"><label for="f-mdm-${key}">${label}</label><input type="checkbox" role="switch" id="f-mdm-${key}" ${d.mdm?.[key]?'checked':''}></div>`).join('')}</div></section><datalist id="os-options"><option value="iOS"><option value="iPadOS"><option value="macOS"><option value="Windows"><option value="Android"><option value="Linux"></datalist><div class="button-row"><button class="btn primary" type="submit">${editId?'Save changes':'Save device'}</button><button class="btn" type="button" data-action="cancel-form">Cancel</button></div></form>`}
  function attachForm(){$('#f-mdm-enabled').addEventListener('change',e=>{$('#form-mdm-options').hidden=!e.target.checked});$('#device-form').addEventListener('submit',e=>{e.preventDefault();const form=e.currentTarget;form.querySelectorAll('.error').forEach(n=>n.textContent='');const data=Object.fromEntries(new FormData(form).entries());let invalid=false;for(const [key,,required] of formFields){data[key]=(data[key]||'').trim();if(required&&!data[key]){$('#error-'+key).textContent='Required field';invalid=true}}if(data.assetId&&devices.some(d=>d.id!==editId&&d.assetId.toLowerCase()===data.assetId.toLowerCase())){$('#error-assetId').textContent='Asset ID already in use';invalid=true}if(data.imei&& !/^[0-9]{14,16}$/.test(data.imei)){$('#error-imei').textContent='Enter 14–16 digits, or leave blank';invalid=true}if(invalid){form.querySelector('.error:not(:empty)')?.previousElementSibling?.focus();toast('Please check the highlighted fields.');return}let mdm={enabled:$('#f-mdm-enabled').checked};for(const [key] of mdmKeys)mdm[key]=mdm.enabled&&$('#f-mdm-'+key).checked;data.assetId=data.assetId||asset();const prior=find(editId);const item={...prior,...data,id:prior?.id||uid(),createdAt:prior?.createdAt||new Date().toISOString(),mdm};if(prior)devices=devices.map(d=>d.id===prior.id?item:d);else devices.unshift(item);if(!saveDevices())return;const wasEdit=!!prior;editId=null;openDevice(item.id);toast(wasEdit?'Device updated.':'Device added to inventory.')})}
  function detail(){const d=find(selected);if(!d)return empty('Device not found','Return to the inventory.');const entries=[['Device name',d.name],['Device type',d.type],['Manufacturer',d.manufacturer],['Model',d.model],['Serial number',d.serial],['IMEI',d.imei],['Asset ID',d.assetId],['Operating system',d.os],['OS version',d.osVersion],['Assigned user',d.user],['Location',d.location],['Purchase date',d.purchaseDate],['Notes',d.notes],['Status',d.status]];return heading(d.name,`${d.type} · ${d.model}`,btn('all','← All devices'))+`<div class="button-row mb-5">${btn('edit','Edit',d.id,'primary')}${btn('label','Print Label',d.id)}${btn('qr','Generate QR Code',d.id)}${btn('barcode','Generate Barcode',d.id)}</div><div class="detail-grid"><section class="panel detail-info"><h2 class="section-title mb-5">Device information ${badge(d.status)}</h2><dl class="detail-fields">${entries.map(([k,v])=>`<div><dt>${k}</dt><dd>${esc(v||'—')}</dd></div>`).join('')}</dl><h3 class="section-title mt-7 mb-3">Update status</h3><div class="button-row">${['Lost','Stolen','Active'].map(s=>btn('set-status','Mark '+s,d.id,s==='Stolen'?'danger':s==='Lost'?'warning':'')).join('')}</div></section><aside class="panel codes-panel"><h2 class="section-title">Identification codes</h2><p class="subtle mt-2" style="font-size:12px">Unique to this device. Ready for labels.</p><h3 class="mt-5 font-semibold" style="font-size:13px">QR code</h3><div id="detail-qr" class="code-box"></div><div class="mono muted">${esc(codeUrl(d))}</div><h3 class="mt-5 font-semibold" style="font-size:13px">Asset barcode</h3><div class="code-box"><svg id="detail-barcode"></svg></div><div class="mono muted">${esc(d.assetId)}</div></aside></div><section class="panel mdm-box"><h2 class="section-title">Home MDM</h2><p class="subtle mt-2 mb-4" style="font-size:12px">Prototype controls only — real Apple MDM commands will be connected later.</p><div class="toggle-row"><label for="detail-mdm-enabled">Enable Home MDM</label><input type="checkbox" role="switch" id="detail-mdm-enabled" data-mdm="enabled" data-id="${esc(d.id)}" ${d.mdm.enabled?'checked':''}></div>${d.mdm.enabled?`<div class="grid grid-cols-1 md:grid-cols-2 gap-x-7">${mdmKeys.map(([key,label])=>`<div class="toggle-row"><label for="detail-${key}">${label}</label><input type="checkbox" role="switch" id="detail-${key}" data-mdm="${key}" data-id="${esc(d.id)}" ${d.mdm[key]?'checked':''}></div>`).join('')}</div><div class="button-row mt-5">${btn('lock','Lock Device',d.id)}${btn('lost-mode','Lost Mode',d.id)}${btn('erase','Erase Device',d.id,'danger')}</div>`:''}</section>`}
  function renderQR(el,value){if(!el)return;el.innerHTML='';if(window.QRCode){new QRCode(el,{text:value,width:120,height:120,colorDark:'#101820',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M})}else{el.textContent=value}}
  function renderBarcode(el,value){if(!el)return;if(window.JsBarcode){try{JsBarcode(el,value,{format:'CODE128',width:1.6,height:53,displayValue:true,fontSize:12,margin:4,lineColor:'#101820'})}catch{el.replaceWith(document.createTextNode(value))}}else{el.replaceWith(document.createTextNode(value))}}
  function renderCodes(){const d=find(selected);if(d){renderQR($('#detail-qr'),codeUrl(d));renderBarcode($('#detail-barcode'),d.assetId)}}
  function lost(){const list=devices.filter(d=>['Lost','Stolen'].includes(d.status));return heading('Lost & Stolen','Quickly identify missing devices and restore recovered ones.')+(list.length?`<div class="device-grid">${list.map(d=>`<article class="panel device-card" style="border-left:3px solid ${d.status==='Lost'?'#eac35b':'#f27379'}"><div class="flex justify-between items-start"><h2 class="section-title">${esc(d.name)}</h2>${badge(d.status)}</div><p class="muted my-3" style="font-size:12px">${esc(d.model)} · ${esc(d.assetId)}<br>${esc(d.location||'Location unknown')}</p><div class="button-row">${btn('open','Details',d.id)}${btn('set-active','Return to Active',d.id)}</div></article>`).join('')}</div>`:empty('No missing devices','Lost and stolen devices will appear here.'))}
  function mdmPage(){const list=devices.filter(d=>d.mdm.enabled);return heading('Home MDM','Manage opt-in prototype device controls.')+`<div class="panel p-5 mb-5" style="border-left:3px solid #519bff"><strong>Prototype controls only — real Apple MDM commands will be connected later.</strong><p class="subtle mt-1 mb-0" style="font-size:12px">These switches only update your local inventory; they do not contact or manage devices.</p></div><div class="flex gap-4 mb-5"><div class="panel stat" style="min-width:160px"><span class="stat-label">MDM enabled</span><div class="number">${list.length}</div></div><div class="panel stat" style="min-width:160px"><span class="stat-label">MDM enrolled</span><div class="number">${list.filter(d=>d.mdm.enrolled).length}</div></div></div>${list.length?`<div class="device-grid">${list.map(d=>`<article class="panel device-card"><div class="flex justify-between gap-2"><h2 class="section-title">${esc(d.name)}</h2>${badge(d.status)}</div><p class="muted mt-2" style="font-size:12px">${esc(d.model)} · ${esc(d.assetId)}</p><p class="mt-4 mb-4" style="font-size:12px;line-height:1.9">${mdmKeys.map(([key,label])=>`${esc(label)}: <strong style="color:${d.mdm[key]?'#8ce5bf':'#a7b4c4'}">${d.mdm[key]?'On':'Off'}</strong>`).join('<br>')}</p>${btn('open','Open controls',d.id)}</article>`).join('')}</div>`:empty('No devices have Home MDM enabled','Open a device to opt in to prototype MDM controls.'))}`}
  function labels(){return heading('Device labels','Print identification labels for your inventory.')+(devices.length?`<div class="panel table-scroller"><table class="device-table"><thead><tr><th>Device</th><th>Asset ID</th><th>Serial</th><th>Status</th><th>Label</th></tr></thead><tbody>${devices.map(d=>`<tr><td><strong>${esc(d.name)}</strong><br><span class="muted">${esc(d.model)}</span></td><td class="mono">${esc(d.assetId)}</td><td class="mono">${esc(d.serial)}</td><td>${badge(d.status)}</td><td>${btn('label','Print Label',d.id,'primary')}</td></tr>`).join('')}</tbody></table></div>`:empty('No devices to label','Add a device before printing a label.'))}
  function settingsPage(){return heading('Settings','Tailor your local workspace and manage example records.')+`<div class="panel form-section" style="max-width:680px"><h2>Display preferences</h2><div class="field"><label for="app-title">Application title</label><input id="app-title" maxlength="48" value="${esc(settings.title)}"></div><div class="toggle-row mt-4"><label for="confirm-destructive">Confirm device deletions</label><input id="confirm-destructive" type="checkbox" role="switch" ${settings.confirmDestructive?'checked':''}></div><button type="button" class="btn primary mt-4" data-action="save-settings">Save preferences</button></div><div class="panel form-section mt-4" style="max-width:680px"><h2>Inventory maintenance</h2><p class="subtle" style="font-size:13px">Restore the original example devices or permanently clear the inventory saved in this browser.</p><div class="button-row mt-5">${btn('reset','Reset example data')}${btn('clear','Clear all inventory','','danger')}</div></div>`}
  function setStatus(id,status){const d=find(id);if(!d)return;d.status=status;if(saveDevices()){render();toast(`${d.name} marked ${status}.`)}}
  function ask(title,message,action,label='Confirm'){confirmCallback=action;$('#confirm-title').textContent=title;$('#confirm-message').textContent=message;$('#confirm-accept').textContent=label;$('#confirm-overlay').classList.remove('hidden');$('#confirm-accept').focus()}
  function closeConfirm(){confirmCallback=null;$('#confirm-overlay').classList.add('hidden')}
  function printLabel(id){const d=find(id);if(!d)return;$('#label-preview').innerHTML=`<div class="print-label"><div style="display:flex;justify-content:space-between;align-items:start;gap:8px"><div><strong style="font-size:16px">${esc(d.name)}</strong><div class="mono" style="margin-top:5px">${esc(d.assetId)}</div></div>${badge(d.status)}</div><div style="font-size:11px;margin-top:10px">SERIAL: <strong>${esc(d.serial)}</strong></div><div id="label-qr" class="code-box"><div></div></div><div class="code-box"><svg id="label-barcode"></svg></div></div>`;renderQR($('#label-qr>div'),codeUrl(d));renderBarcode($('#label-barcode'),d.assetId);$('#print-overlay').classList.remove('hidden');$('#print-overlay').setAttribute('aria-hidden','false');$('#print-action').focus()}
  function closeDrawer(){$('#sidebar').classList.remove('open');$('#drawer-backdrop').classList.remove('open');$('#menu-toggle').setAttribute('aria-expanded','false')}
  document.addEventListener('click',e=>{const nav=e.target.closest('[data-nav]');if(nav){navigate(nav.dataset.nav);return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id,d=find(id);switch(a){
    case 'add':navigate('Add Device');break;case 'all':navigate('Devices');break;case 'open':openDevice(id);break;
    case 'edit':editId=id;view='Add Device';render();window.scrollTo(0,0);break;
    case 'cancel-form':if(editId)openDevice(editId);else navigate('Devices');break;
    case 'label':printLabel(id);break;case 'qr':renderQR($('#detail-qr'),codeUrl(d));toast('Device QR code generated.');break;
    case 'barcode':renderBarcode($('#detail-barcode'),d.assetId);toast('Asset barcode generated.');break;
    case 'set-active':setStatus(id,'Active');break;
    case 'set-status':setStatus(id,b.textContent.replace('Mark ','').trim());break;
    case 'status-menu':ask('Change device status',`Choose a status for ${d.name}.`,()=>{},'Close');$('#confirm-message').innerHTML=`Choose a status for <strong>${esc(d.name)}</strong>:<br><span class="button-row" style="display:flex;margin-top:15px">${statuses.map(s=>btn('choose-status',s,id)).join('')}</span>`;break;
    case 'choose-status':closeConfirm();setStatus(id,b.textContent.trim());break;
    case 'delete':{const remove=()=>{devices=devices.filter(x=>x.id!==id);if(saveDevices()){render();toast('Device deleted.')}};settings.confirmDestructive?ask('Delete device?',`Remove ${d.name} from your local inventory? This cannot be undone.`,remove,'Delete device'):remove();break}
    case 'lock':d.mdm.remoteLock=!d.mdm.remoteLock;if(saveDevices()){render();toast(`Prototype remote lock ${d.mdm.remoteLock?'enabled':'disabled'}; no device command was sent.`)}break;
    case 'lost-mode':d.mdm.lostMode=!d.mdm.lostMode;if(saveDevices()){render();toast(`Prototype Lost Mode ${d.mdm.lostMode?'enabled':'disabled'}; no device command was sent.`)}break;
    case 'erase':ask('Prototype erase control',`Real MDM erase functionality will be connected later. Confirming only updates the prototype Remote Erase switch for ${d.name}; no device will be erased.`,()=>{d.mdm.remoteErase=true;if(saveDevices()){render();toast('Prototype Remote Erase enabled. No device was erased.')}},'Update prototype state');break;
    case 'save-settings':{const title=$('#app-title').value.trim();if(!title){toast('Enter an application title.');$('#app-title').focus();return}settings.title=title;settings.confirmDestructive=$('#confirm-destructive').checked;saveSettings();render();toast('Preferences saved.');break}
    case 'reset':ask('Reset example data?', 'Replace the entire current inventory with the original example devices? Your existing devices will be removed.',()=>{devices=seed.map((x,i)=>normalize({...x,id:'example-'+(i+1),createdAt:new Date(Date.now()-i*86400000).toISOString()}));if(saveDevices()){render();toast('Example devices restored.')}},'Reset examples');break;
    case 'clear':ask('Clear all inventory?',`Permanently delete all ${devices.length} devices saved in this browser? This cannot be undone.`,()=>{devices=[];if(saveDevices()){render();toast('Inventory cleared.')}},'Clear all devices');break;
  }});
  document.addEventListener('change',e=>{const t=e.target;if(t.id==='status-filter'){filters.status=t.value;render()}else if(t.id==='type-filter'){filters.type=t.value;render()}else if(t.id==='mdm-filter'){filters.mdm=t.value;render()}else if(t.dataset.mdm){const d=find(t.dataset.id);if(!d)return;d.mdm[t.dataset.mdm]=t.checked;if(!saveDevices()){t.checked=!t.checked;return}render();toast(`${t.dataset.mdm==='enabled'?'Home MDM':mdmKeys.find(x=>x[0]===t.dataset.mdm)?.[1]} ${t.checked?'enabled':'disabled'} in prototype.`)}});
  $('#global-search').addEventListener('input',e=>{const q=e.target.value.trim().toLowerCase(),box=$('#search-results');if(view==='Devices')render();if(!q){box.classList.add('hidden');return}const hits=devices.filter(d=>matches(d,q)).slice(0,8);box.innerHTML=hits.length?hits.map(d=>`<button type="button" class="search-result" role="option" data-action="open" data-id="${esc(d.id)}">${esc(d.name)}<small>${esc(d.assetId)} · ${esc(d.model)} · ${esc(d.user||'Unassigned')}</small></button>`).join(''):'<div class="p-4 subtle" style="font-size:12px">No matching devices</div>';box.classList.remove('hidden')});
  $('#menu-toggle').addEventListener('click',()=>{const open=$('#sidebar').classList.toggle('open');$('#drawer-backdrop').classList.toggle('open',open);$('#menu-toggle').setAttribute('aria-expanded',String(open))});$('#drawer-backdrop').addEventListener('click',closeDrawer);
  $('#confirm-cancel').addEventListener('click',closeConfirm);$('#confirm-accept').addEventListener('click',()=>{const fn=confirmCallback;closeConfirm();fn?.()});$('#confirm-overlay').addEventListener('click',e=>{if(e.target.id==='confirm-overlay')closeConfirm()});
  $('#print-close').addEventListener('click',()=>{ $('#print-overlay').classList.add('hidden'); $('#print-overlay').setAttribute('aria-hidden','true'); });$('#print-action').addEventListener('click',()=>window.print());$('#print-overlay').addEventListener('click',e=>{if(e.target.id==='print-overlay'){ $('#print-overlay').classList.add('hidden'); $('#print-overlay').setAttribute('aria-hidden','true'); }});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeConfirm();$('#print-overlay').classList.add('hidden');$('#print-overlay').setAttribute('aria-hidden','true');$('#search-results').classList.add('hidden');closeDrawer()}});
  document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))$('#search-results').classList.add('hidden')});
  document.getElementById('print-overlay').classList.add('hidden');
  render();
})();
</script>
 
</body></html>
